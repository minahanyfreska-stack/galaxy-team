<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Teams</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{color:#fff;background:#020512 url("galaxy-bg.jpg") center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#02051255,#020512dd);z-index:-1}
header{padding:18px 5%;background:#030716dd;border-bottom:1px solid #33406b;display:flex;justify-content:space-between;align-items:center}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px}
header button{background:#151f45;color:#fff;border:1px solid #46558c}
main{max-width:1000px;margin:auto;padding:45px 20px}.hero{text-align:center}
.hero h1{font-size:clamp(32px,7vw,52px);margin:18px 0}.hero p{color:#bdc7e5}
.badge{display:inline-block;padding:8px 15px;border-radius:30px;background:#211344;border:1px solid #8b61ee}
.card{background:#050b20ed;border:1px solid #34416d;border-radius:20px;padding:22px;box-shadow:0 15px 50px #0008}
.join{max-width:620px;margin:25px auto}.join input{width:100%;padding:14px;background:#03071a;color:#fff;border:1px solid #3d4b7c;border-radius:12px;margin:10px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.team{padding:18px;text-align:center;background:#0a1130;border:1px solid #33416f;border-radius:15px}.team.sel{border-color:#b083ff;box-shadow:0 0 18px #8c5cff55}.icon{font-size:40px}
.team small{display:block;color:#aab5d5;margin-top:5px}.primary{width:100%;background:linear-gradient(100deg,#356bff,#a12be2);color:#fff;font-weight:bold;margin-top:10px}
.hidden{display:none!important}.top{display:flex;gap:15px;align-items:center}.top .grow{flex:1}.big{font-size:55px}.muted{color:#aab6d7}.post,.rank{padding:14px;margin-top:10px;border:1px solid #2c3860;border-radius:14px;background:#09112b}.rank{display:flex;justify-content:space-between}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modal .card{width:min(430px,100%)}.modal input{width:100%;padding:13px;background:#03071a;color:#fff;border:1px solid #3d4b7c;border-radius:12px}
@media(max-width:650px){.teams{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div>🪐 <b>Galaxy Teams</b></div><button id="admin">لوحة التحكم ⚙️</button></header>
<main>
<section id="join">
<div class="hero"><span class="badge">🌌 أهلاً بك في المجرة</span><h1>4 فرق • هدف واحد 🚀</h1><p>اكتب اسمك واختار الكوكب الخاص بفريقك.</p></div>
<div class="card join">
<input id="name" placeholder="اكتب اسمك">
<div id="teams" class="teams"></div>
<button id="joinBtn" class="primary">دخول الفريق</button>
<p id="msg"></p>
</div>
</section>
<section id="member" class="hidden">
<div class="card">
<div class="top"><div id="icon" class="big">🌌</div><div class="grow"><small>أهلاً يا</small><h2 id="memberName"></h2><div id="memberTeam" class="muted"></div></div><button id="logout">تغيير الحساب</button></div>
<hr><h2>✨ المحتوى الحالي</h2><div id="posts">لا يوجد محتوى حاليًا.</div>
<h2>🏆 ترتيب الفرق</h2><div id="ranking"></div>
</div>
</section>
</main>
<div id="modal" class="modal hidden"><div class="card"><h2>🔐 دخول الإدارة</h2><input id="pass" type="password" placeholder="كلمة المرور"><button id="login" class="primary">دخول</button><button id="close" style="margin-top:8px;width:100%">إلغاء</button><p id="loginMsg"></p></div></div>
<script>
const teams=[["jupiter","المشتري","🪐"],["saturn","زحل","💍"],["neptune","نبتون","🔵"],["uranus","أورانوس","🩵"]];
let selected="";
const $=x=>document.getElementById(x);
function renderTeams(){$("teams").innerHTML=teams.map(t=>'<div class="team '+(selected===t[0]?'sel':'')+'" data-id="'+t[0]+'"><div class="icon">'+t[2]+'</div><b>'+t[1]+'</b><small>'+t[0]+'</small></div>').join("");document.querySelectorAll(".team").forEach(x=>x.onclick=()=>{selected=x.dataset.id;renderTeams()})}
function load(k,d){try{return JSON.parse(localStorage.getItem("g_"+k))||d}catch(e){return d}}
function save(k,v){localStorage.setItem("g_"+k,JSON.stringify(v))}
function join(){let n=$("name").value.trim();if(n.length<2||!selected){$("msg").textContent="اكتب اسمك واختار فريقك.";return}let ms=load("members",[]),m=ms.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!m){m={id:Date.now(),name:n,team:selected};ms.push(m);save("members",ms)}localStorage.setItem("g_member",m.id);show(m)}
function show(m){$("join").classList.add("hidden");$("member").classList.remove("hidden");let t=teams.find(x=>x[0]===m.team);$("icon").textContent=t[2];$("memberName").textContent=m.name;$("memberTeam").textContent="فريق "+t[1];let ps=load("posts",[]);$("posts").innerHTML=ps.length?ps.slice().reverse().map(p=>'<div class="post"><b>'+p.title+'</b><p>'+p.body+'</p></div>').join(""):"لا يوجد محتوى حاليًا.";let sc=load("scores",teams.map(t=>({id:t[0],score:0})));$("ranking").innerHTML=teams.map(t=>({t,s:(sc.find(x=>x.id===t[0])||{score:0}).score})).sort((a,b)=>b.s-a.s).map((x,i)=>'<div class="rank"><span>#'+(i+1)+' '+x.t[2]+' '+x.t[1]+'</span><b>⭐ '+x.s+'</b></div>').join("")}
$("joinBtn").onclick=join;$("logout").onclick=()=>{localStorage.removeItem("g_member");$("member").classList.add("hidden");$("join").classList.remove("hidden")};
$("admin").onclick=()=>$("modal").classList.remove("hidden");$("close").onclick=()=>$("modal").classList.add("hidden");$("login").onclick=()=>{if($("pass").value==="Galaxy2026"){alert("لوحة الإدارة ستضاف في النسخة المتصلة بقاعدة بيانات.");$("modal").classList.add("hidden")}else $("loginMsg").textContent="كلمة المرور غير صحيحة."};
renderTeams();
</script>
</body></html>
