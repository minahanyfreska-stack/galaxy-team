<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GALAXY TEAMS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(40,80,150,.18),
          transparent 35%
        ),
        radial-gradient(
          circle at 10% 80%,
          rgba(70,40,140,.15),
          transparent 30%
        ),
        #02050c;
    }

    /* =========================
       SPACE BACKGROUND
    ========================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.95) 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(130,190,255,.8) 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(180,140,255,.65) 1px,
          transparent 1.5px
        );

      background-size:
        120px 120px,
        210px 210px,
        310px 310px;

      animation: starsMove 50s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 50%,
          transparent 0%,
          rgba(0,0,0,.15) 45%,
          rgba(0,0,0,.75) 100%
        );
    }

    @keyframes starsMove {
      from {
        background-position:
          0 0,
          0 0,
          0 0;
      }

      to {
        background-position:
          300px 500px,
          -400px 300px,
          250px -350px;
      }
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: min(1450px,94%);
      margin: 18px auto;

      padding: 16px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border:
        1px solid
        rgba(130,190,255,.2);

      border-radius: 22px;

      background:
        rgba(3,8,18,.72);

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);
    }

    .brand b {
      display: block;

      font-size: 26px;
      letter-spacing: 6px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #9bdcff,
          #b99aff,
          #ffffff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand small {
      opacity: .45;
      letter-spacing: 2px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1450px,94%);
      margin: auto;
    }

    .page {
      min-height: calc(100vh - 100px);
      padding-bottom: 80px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      padding: 55px 10px 35px;
    }

    .badge {
      display: inline-block;

      padding: 9px 20px;

      border-radius: 999px;

      border:
        1px solid
        rgba(120,200,255,.3);

      background:
        rgba(70,130,220,.08);

      color: #a9ddff;

      box-shadow:
        0 0 30px
        rgba(80,160,255,.12);
    }

    .hero h1 {
      margin: 20px 0 8px;

      font-size:
        clamp(48px,8vw,100px);

      letter-spacing: 8px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #9edcff,
          #b69aff,
          #fff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 50px
        rgba(100,180,255,.2);
    }

    .hero h2 {
      margin: 10px;
      font-size: clamp(24px,4vw,42px);
    }

    .hero p {
      opacity: .55;
      font-size: 17px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      padding: 28px;

      border-radius: 28px;

      border:
        1px solid
        rgba(150,200,255,.15);

      background:
        linear-gradient(
          145deg,
          rgba(8,15,28,.82),
          rgba(2,6,15,.72)
        );

      backdrop-filter: blur(18px);

      box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.05);
    }

    .join-card {
      width: 100%;
    }

    /* =========================
       PLANETS
    ========================= */

    .teams-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .teams-title h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .teams-title p {
      margin: 0;
      opacity: .5;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 24px;
    }

    .team {
      position: relative;

      min-height: 390px;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      padding: 18px;

      border-radius: 30px;

      border:
        1px solid
        rgba(150,200,255,.22);

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(80,130,210,.12),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          rgba(8,15,28,.95),
          rgba(2,5,13,.98)
        );

      cursor: pointer;

      transition:
        transform .45s ease,
        box-shadow .45s ease,
        border-color .45s ease;
    }

    /* النجوم داخل كل Team */

    .team::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.95) 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(120,190,255,.8) 1px,
          transparent 1.5px
        );

      background-size:
        55px 55px,
        95px 95px;

      opacity: .42;

      animation:
        teamStars 20s linear infinite;

      pointer-events: none;
    }

    @keyframes teamStars {
      from {
        background-position:
          0 0,
          0 0;
      }

      to {
        background-position:
          160px 220px,
          -180px 130px;
      }
    }

    /* وهج خلف الكوكب */

    .team .planet-glow {
      position: absolute;

      width: 260px;
      height: 260px;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(100,170,255,.22),
          rgba(80,130,220,.08) 40%,
          transparent 70%
        );

      filter: blur(15px);

      pointer-events: none;
    }

    /* الكوكب */

    .team img {
      position: absolute;

      top: 30px;
      left: 50%;

      width: 220px;
      height: 220px;

      transform: translateX(-50%);

      object-fit: contain;

      z-index: 3;

      filter:
        drop-shadow(
          0 0 18px
          rgba(130,190,255,.35)
        )
        drop-shadow(
          0 20px 35px
          rgba(0,0,0,.7)
        );

      animation:
        planetFloat 5s ease-in-out infinite;
    }

    @keyframes planetFloat {
      0%,100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-1deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-12px)
          rotate(1deg);
      }
    }

    /* معلومات الكوكب */

    .team-info {
      position: relative;

      z-index: 5;

      width: 100%;

      text-align: center;

      padding: 18px 10px 12px;

      border-radius: 20px;

      background:
        linear-gradient(
          to bottom,
          rgba(2,5,12,.05),
          rgba(2,5,12,.9)
        );
    }

    .team-arabic {
      display: block;

      font-size: 28px;
      font-weight: 900;

      color: #fff;

      text-shadow:
        0 3px 18px #000;
    }

    .team-english {
      display: block;

      margin-top: 5px;

      font-size: 15px;

      letter-spacing: 4px;

      color: #a8dfff;
    }

    .team-number {
      display: block;

      margin-top: 8px;

      font-size: 10px;

      letter-spacing: 4px;

      opacity: .4;
    }

    .team:hover {
      transform:
        translateY(-12px)
        scale(1.025);

      border-color:
        rgba(130,210,255,.65);

      box-shadow:
        0 35px 90px rgba(0,0,0,.8),
        0 0 45px
        rgba(80,170,255,.18);
    }

    .team.sel {
      transform:
        translateY(-8px);

      border-color:
        rgba(110,220,255,.95);

      box-shadow:
        0 0 55px
        rgba(70,190,255,.35),
        0 30px 80px
        rgba(0,0,0,.75);
    }

    /* =========================
       LOGIN
    ========================= */

    .login-box {
      max-width: 600px;
      margin: 30px auto 0;
      text-align: center;
    }

    input,
    textarea,
    select {
      width: 100%;

      margin: 8px 0;

      padding: 15px 17px;

      border-radius: 14px;

      border:
        1px solid
        rgba(255,255,255,.13);

      outline: none;

      background:
        rgba(0,0,0,.4);

      color: white;

      font-size: 16px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #68d8ff;

      box-shadow:
        0 0 25px
        rgba(80,190,255,.12);
    }

    select option {
      background: #101827;
      color: white;
    }

    button {
      border: 0;

      border-radius: 14px;

      padding: 13px 20px;

      color: white;

      background:
        rgba(255,255,255,.1);

      cursor: pointer;

      transition: .25s;

      font-size: 15px;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      width: 100%;

      margin-top: 8px;

      background:
        linear-gradient(
          90deg,
          #276cff,
          #744dff,
          #20bfff
        );

      font-weight: bold;

      box-shadow:
        0 12px 35px
        rgba(50,100,255,.25);
    }

    .scan-button {
      width: 100%;
      margin-top: 10px;
    }

    /* =========================
       MEMBER
    ========================= */

    .member-head {
      display: flex;
      align-items: center;
      gap: 22px;

      padding: 22px;

      border-radius: 24px;

      background:
        rgba(4,10,22,.7);

      border:
        1px solid
        rgba(140,200,255,.15);

      margin-bottom: 25px;
    }

    .member-main-photo {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      object-fit: cover;

      border:
        2px solid
        rgba(100,210,255,.6);

      box-shadow:
        0 0 35px
        rgba(70,180,255,.25);
    }

    #memberName {
      margin: 0;

      font-size:
        clamp(32px,5vw,60px);

      background:
        linear-gradient(
          90deg,
          #fff,
          #a9e6ff,
          #bba1ff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #memberTeam {
      margin: 7px 0;
      color: #75ddff;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
    }

    .post {
      padding: 20px 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.1);
    }

    .post h3 {
      font-size: 24px;
    }

    .post small {
      opacity: .45;
    }

    .post-image {
      display: block;

      width: 100%;

      max-height: 550px;

      object-fit: contain;

      margin-top: 15px;

      border-radius: 18px;

      background: #000;
    }

    .replies {
      margin-top: 20px;
      padding-top: 18px;

      border-top:
        1px solid
        rgba(255,255,255,.1);
    }

    .reply {
      margin: 10px 0;
      padding: 13px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.05);
    }

    .reply small {
      display: block;
    }

    .reply-box {
      margin-top: 15px;
    }

    /* =========================
       RANK
    ========================= */

    .rank,
    .member,
    .score {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 10px;

      padding: 14px;

      margin: 9px 0;

      border-radius: 15px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid
        rgba(255,255,255,.07);
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-grid {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 20px;
    }

    .admin-post {
      padding: 15px;
      margin: 10px 0;

      border-radius: 16px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid
        rgba(255,255,255,.08);
    }

    .admin-member-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-member-photo {
      width: 55px;
      height: 55px;

      border-radius: 50%;

      object-fit: cover;

      background:
        radial-gradient(
          circle,
          #497db0,
          #080d18
        );
    }

    .admin-member-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .delete-btn {
      background:
        rgba(255,50,70,.15);
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      display: grid;
      place-items: center;

      padding: 20px;

      background:
        rgba(0,0,0,.8);

      backdrop-filter: blur(15px);

      z-index: 100;
    }

    .modal .card {
      width: min(480px,100%);
    }

    #adminQR {
      margin: 20px auto;

      width: fit-content;

      padding: 10px;

      background: white;

      border-radius: 12px;
    }

    .qr-scanner {
      width: min(450px,100%);

      margin: 20px auto;

      overflow: hidden;

      border-radius: 20px;

      background: #000;
    }

    .qr-scanner video {
      width: 100% !important;
    }

    .login-result {
      margin-top: 20px;
      padding: 20px;

      border-radius: 18px;

      background:
        rgba(70,130,255,.1);
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:1000px) {
      .teams {
        grid-template-columns: repeat(2,1fr);
      }

      .grid,
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:600px) {
      header {
        width: 94%;
        padding: 13px 15px;
      }

      .brand b {
        font-size: 20px;
        letter-spacing: 3px;
      }

      .brand small {
        font-size: 9px;
      }

      .hero {
        padding-top: 35px;
      }

      .hero h1 {
        font-size: 47px;
        letter-spacing: 4px;
      }

      .card {
        padding: 17px;
        border-radius: 22px;
      }

      .teams {
        grid-template-columns: repeat(2,1fr);
        gap: 11px;
      }

      .team {
        min-height: 245px;
        border-radius: 20px;
        padding: 8px;
      }

      .team img {
        width: 125px;
        height: 125px;
        top: 22px;
      }

      .team .planet-glow {
        width: 160px;
        height: 160px;
      }

      .team-arabic {
        font-size: 19px;
      }

      .team-english {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .team-info {
        padding: 10px 3px;
      }

      .member-head {
        flex-wrap: wrap;
      }

      .member-main-photo {
        width: 90px;
        height: 90px;
      }

      .member-head button {
        width: 100%;
      }

      .rank,
      .score {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <b>GALAXY</b>
      <small>SPACE • TEAMS • MISSION</small>
    </div>

    <button id="adminOpen">
      الإدارة
    </button>
  </header>


  <main>

    <!-- =========================
         JOIN
    ========================= -->

    <section id="join" class="page">

      <div class="hero">

        <span class="badge">
          ✦ WELCOME TO THE UNIVERSE ✦
        </span>

        <h1>GALAXY</h1>

        <h2>اختار مجرتك</h2>

        <p>
          كل فريق له كوكبه الخاص
        </p>

      </div>


      <div class="card join-card">

        <div class="teams-title">
          <h2>الكواكب</h2>
          <p>
            اختار الفريق للدخول إلى عالمك
          </p>
        </div>


        <!-- هنا الكواكب هتظهر تلقائيًا من app.js -->

        <div
          id="teams"
          class="teams"
        ></div>


        <div class="login-box">

          <h3>
            تسجيل الدخول
          </h3>

          <input
            id="accessCode"
            type="text"
            placeholder="اكتب كود الدخول"
            autocomplete="off"
          >

          <button
            id="codeLoginBtn"
            class="primary"
          >
            دخول إلى المجرة
          </button>

          <button
            id="scanQRBtn"
            class="scan-button"
          >
            📷 الدخول باستخدام QR
          </button>

          <div
            id="qrScanner"
            class="qr-scanner hidden"
          ></div>

          <p id="scanMsg"></p>
          <p id="msg"></p>

        </div>

      </div>

    </section>


    <!-- =========================
         MEMBER
    ========================= -->

    <section
      id="member"
      class="page hidden"
    >

      <div class="member-head">

        <img
          id="memberPhoto"
          class="member-main-photo"
          src=""
          alt="صورة العضو"
        >

        <div style="flex:1">

          <h1 id="memberName">
            العضو
          </h1>

          <h3 id="memberTeam">
            الفريق
          </h3>

        </div>

        <button id="logout">
          خروج
        </button>

      </div>


      <div class="grid">

        <div class="card">

          <h2>
            منشورات الفريق
          </h2>

          <div id="posts"></div>

        </div>


        <div class="card">

          <h2>
            ترتيب الفرق
          </h2>

          <div id="ranking"></div>

        </div>

      </div>

    </section>


    <!-- =========================
         ADMIN
    ========================= -->

    <section
      id="admin"
      class="page hidden"
    >

      <div class="hero">

        <h1>
          ADMIN
        </h1>

        <p>
          لوحة التحكم
        </p>

      </div>


      <div class="admin-grid">

        <div class="card">

          <h2>
            إضافة عضو
          </h2>

          <input
            id="newMemberName"
            placeholder="اسم العضو"
          >

          <select id="newMemberTeam">
            <option value="">
              اختر الفريق
            </option>
          </select>

          <input
            id="newMemberPhoto"
            type="file"
            accept="image/*"
          >

          <button
            id="addMemberBtn"
            class="primary"
          >
            إنشاء العضو
          </button>

          <div id="newMemberResult"></div>

        </div>


        <div class="card">

          <h2>
            نشر منشور
          </h2>

          <input
            id="postTitle"
            placeholder="عنوان المنشور"
          >

          <textarea
            id="postBody"
            placeholder="محتوى المنشور"
          ></textarea>

          <select id="postTeam">
            <option value="all">
              كل الفرق
            </option>
          </select>

          <input
            id="postImage"
            type="file"
            accept="image/*"
          >

          <button
            id="postBtn"
            class="primary"
          >
            نشر
          </button>

        </div>


        <div class="card">

          <h2>
            نقاط الفرق
          </h2>

          <div id="scores"></div>

        </div>

      </div>


      <div class="card" style="margin-top:20px">

        <h2>
          الأعضاء
        </h2>

        <div id="members"></div>

      </div>


      <div class="card" style="margin-top:20px">

        <h2>
          المنشورات
        </h2>

        <div id="adminPosts"></div>

      </div>


      <button
        id="adminLogout"
        style="margin-top:20px"
      >
        خروج من الإدارة
      </button>

    </section>

  </main>


  <!-- =========================
       ADMIN LOGIN MODAL
  ========================= -->

  <div
    id="loginModal"
    class="modal hidden"
  >

    <div class="card">

      <h2>
        دخول الإدارة
      </h2>

      <input
        id="adminPass"
        type="password"
        placeholder="كلمة المرور"
      >

      <button
        id="loginBtn"
        class="primary"
      >
        دخول
      </button>

      <button
        id="closeModal"
        style="width:100%;margin-top:8px"
      >
        إلغاء
      </button>

      <p id="loginMsg"></p>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
